source: mixed
notes:
- '16.11.2026: карта URL пользователя; чертежи исключены из требований извлечения;
  приёмка требует свежего контроля. Исторические метрики сохранены.'
crawl:
  render: browser
  exclude_paths: []
sections:
  catalog_roots:
  - /products/
  contacts_urls:
  - /contacts/
  documents_urls:
  - /documentation/
  product_url_patterns:
  - /products/4/?(?:\?|$)
  - /products/7/?(?:\?|$)
  - /products/52/?(?:\?|$)
  - /products/57/?(?:\?|$)
  - /products/25/?(?:\?|$)
  - /products/23/?(?:\?|$)
  product_url_antipatterns:
  - /products/?(?:\?|$)
  - /documentation/?(?:\?|$)
  start_urls:
  - https://sibno.ru/products/
  - https://sibno.ru/contacts/
  - https://sibno.ru/documentation/
extract:
  tier: llm
  markdown:
    company_container: body
    product_container: '#content-holder'
    min_len: 1
    remove_selectors:
    - form
    - .breadcrumbs
    - a:has(img[alt*="Черт"]), a:has(img[alt*="черт"])
    - img[alt*="Черт"], img[alt*="черт"]
    - a[href$=".dwg"], a[href$=".dxf"], a[href$=".cdw"]
  page_rules:
  - name: contacts_keep_footer
    match:
      page_types:
      - company
      - distributor
    extract:
      markdown:
        remove_selectors:
        - nav
        - form
        - button
        - .navbar
        - '[role="navigation"]'
        - .breadcrumbs
        - .breadcrumb
        - .menu
        - '#search-form-holder'
  - name: category_heading
    match:
      path_regex: ^(?:/products/)$
    extract:
      markdown:
        product_container: h1
